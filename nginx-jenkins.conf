# Forward HTTP traffic destined for 192.168.1.146 --> 192.168.1.44:8080 
# Forward traffic destined for the NGINX ip to the Jenkins container on port 8080
# Using FreeIPA for DNS and CA server so I've added a DNS A-Record to jenkins.lab.sanderson.com 192.168.1.146
# Need to make changes to allow for SSL traffic by using FreeIPA CA server.
# To create the key and csr for signing we can issue this command: mkdir -p /etc/nginx/certs && cd /etc/nginx/certs && openssl req -new -newkey rsa:2048 -keyout jenkins.lab.sanderson.com.key -out jenkins.lab.sanderson.com.csr
# paste the contents of the csr file in the host within FreeIPA host list. There is a generate certificate option to add the csr for signing.
server {
    listen 80;
    server_name 192.168.1.146; # Replace with your domain name or public IP if applicable

    location / {
        # Forward the requests to the container on host port 8080
        proxy_pass http://192.168.1.44:8080;

        # Standard headers to preserve the client's original request details
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Optional: Support WebSockets if your container uses them
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
